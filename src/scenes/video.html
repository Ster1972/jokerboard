<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <style>
    
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            padding: 5px;
            border-radius: 1em;
        }
        
        button {
            padding: 5px;
        }
        
        .buttons {
            text-align: center;
            padding: 5px;
        }
        
        .remote-video{
            width: 220px;
            height: 165px;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
        
        .local-video{
            width: 220px;
            height: 165px;
            margin-left: auto;
            margin-right: auto;
            
        }

        .media-controls {
            text-align: center;
            padding: 5px;
        }

        .media-status {
            min-height: 1.5em;
            margin-bottom: 4px;
            text-align: center;
            font-size: 12px;
        }

        .media-status.error {
            color: #dc3545;
        }

        #enable-media,
        #enable-playback {
            margin: 3px;
        }
        
        
        </style>
</head>

<div>
    <video class="local-video block" id='local' volume="0" preload='none' autoplay muted playsinline disablepictureinpicture></video>
</div>

<div class="media-controls">
    <div class="media-status" id="media-status" role="status" aria-live="polite">
        Camera and microphone are off until enabled.
    </div>
    <button type="button" class="btn btn-primary btn-sm" id="enable-media">
        Enable camera and microphone
    </button>
    <button type="button" class="btn btn-primary btn-sm" id="enable-playback" hidden>
        Enable audio/video
    </button>
</div>

<div class="buttons">
    <button type="button" class="btn btn-secondary btn-sm" id="toggle-video" title="Hide Video">
        <i class="bi bi-camera-video-fill" id="buttonVideo"></i>
    </button>
    <button type="button" class="btn btn-secondary btn-sm" id="toggle-mute" title="Mute">
        <i class="bi bi-mic-fill" id="buttonAudio"></i>
    </button>
</div>

<div class="remote-video" id='videos'></div> 
        
  
         
    
    


</html>
