<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <style>
        .video-panel {
            width: 220px;
            box-sizing: border-box;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            padding: 5px;
            border-radius: 1em;
            box-sizing: border-box;
        }
        
        button {
            padding: 5px;
        }
        
        .buttons {
            text-align: center;
            padding: 5px;
        }
        
        .remote-video{
            width: 220px;
            height: 165px;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
        
        .local-video{
            width: 220px;
            height: 165px;
            margin-left: auto;
            margin-right: auto;
            
        }

        .media-controls {
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
        }

        #enable-media,
        #enable-playback {
            margin: 3px;
            max-width: 210px;
        }

        #videos {
            width: 220px;
            height: auto;
            min-height: 0;
        }
        
        
        </style>
</head>

<div class="video-panel">
<div>
    <video class="local-video block" id='local' volume="0" preload='none' autoplay muted playsinline disablepictureinpicture></video>
</div>

<div class="media-controls">
    <button type="button" class="btn btn-primary btn-sm" id="enable-media">
        Enable camera and microphone
    </button>
    <button type="button" class="btn btn-primary btn-sm" id="enable-playback" hidden>
        Enable audio/video
    </button>
</div>

<div class="buttons">
    <button type="button" class="btn btn-secondary btn-sm" id="toggle-video" title="Hide Video">
        <i class="bi bi-camera-video-fill" id="buttonVideo"></i>
    </button>
    <button type="button" class="btn btn-secondary btn-sm" id="toggle-mute" title="Mute">
        <i class="bi bi-mic-fill" id="buttonAudio"></i>
    </button>
</div>

<div class="remote-video" id='videos'></div> 
</div>

</html>
